<svg xmlns="http://www.w3.org/2000/svg" width="1200mm" height="900mm" viewBox="0 0 3000 2250" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">AI TaskFlow - Project Poster</title>
  <desc id="poster-desc">Arabic and English engineering project poster about AI TaskFlow by ADAM MAHMOUD ABDELALIM.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102923"/>
      <stop offset="1" stop-color="#1b5144"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53c49a"/>
      <stop offset="1" stop-color="#a1e5c4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17352c" flood-opacity=".09"/>
    </filter>
    <style>
      .latin { font-family: Arial, "Segoe UI", sans-serif; }
      .arabic { font-family: "Cairo", "Tajawal", "Segoe UI", Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #e4eee8; stroke-width: 2; }
      .head { fill: #173c31; font-size: 41px; font-weight: 700; }
      .body { fill: #344b42; font-size: 30px; }
      .small { fill: #62766d; font-size: 25px; }
      .bullet { fill: #40584e; font-size: 29px; }
      .label { fill: #43856a; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
      .arabic[direction="rtl"][text-anchor="end"] { text-anchor: start; }
    </style>
  </defs>

  <rect width="3000" height="2250" fill="#f3f7f4"/>
  <rect x="0" y="0" width="3000" height="365" fill="url(#header)"/>
  <circle cx="2790" cy="28" r="290" fill="#ffffff" opacity=".035"/>
  <circle cx="2610" cy="360" r="205" fill="#8fe0bc" opacity=".07"/>
  <path d="M0 342 C680 390 1210 318 1840 354 S2640 386 3000 330 V390 H0Z" fill="#f3f7f4"/>

  <g transform="translate(135 89)">
    <rect width="150" height="150" rx="38" fill="#14201d" stroke="#8fe0bc" stroke-width="3"/>
    <g fill="none" stroke="#8fe0bc" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
      <path d="M73 27a25 25 0 0 0-45 13 24 24 0 0 0-9 42 23 23 0 0 0 22 39h32V27Z"/>
      <path d="M77 27a25 25 0 0 1 45 13 24 24 0 0 1 9 42 23 23 0 0 1-22 39H77V27Z"/>
      <path d="M45 61h27m35-13H78M44 98h28m34-9H78M75 27v94m3-58h24m-26 48H49"/>
    </g>
    <g fill="#d9f7e8">
      <circle cx="45" cy="61" r="5"/><circle cx="107" cy="48" r="5"/>
      <circle cx="44" cy="98" r="5"/><circle cx="109" cy="89" r="5"/>
      <circle cx="105" cy="70" r="5"/><circle cx="47" cy="108" r="5"/>
    </g>
  </g>
  <text x="330" y="105" class="latin" fill="#9fe7c2" font-size="25" font-weight="700" letter-spacing="5">AI • PROJECT MANAGEMENT • ENGINE INTEGRATION</text>
  <text x="330" y="207" class="latin" fill="#ffffff" font-size="90" font-weight="700">AI TASKFLOW</text>
  <text x="1800" y="272" class="arabic" direction="rtl" text-anchor="start" fill="#e1f4e9" font-size="39" font-weight="600">منصة لإدارة المهام وربط نماذج الذكاء الاصطناعي بأدوات التطبيق</text>
  <text x="2860" y="105" class="latin" text-anchor="end" fill="#b9ddca" font-size="21" font-weight="700" letter-spacing="3">ENGINEERING PROJECT</text>
  <text x="2860" y="165" class="arabic" direction="rtl" text-anchor="end" fill="#ffffff" font-size="31" font-weight="700">إعداد</text>
  <text x="2860" y="211" class="latin" text-anchor="end" fill="#ffffff" font-size="29" font-weight="700">ADAM MAHMOUD ABDELALIM</text>
  <text x="2860" y="264" class="arabic" direction="rtl" text-anchor="end" fill="#c5e1d1" font-size="23">خوارزمية التكامل والترجمة من إعداد المؤلف</text>

  <!-- Column 1 -->
  <g filter="url(#shadow)">
    <rect class="card" x="90" y="420" width="900" height="305" rx="25"/>
    <rect x="90" y="420" width="12" height="305" rx="6" fill="#56bd91"/>
    <text x="940" y="470" class="latin label" text-anchor="end">01 / THE CHALLENGE</text>
    <text x="940" y="525" class="arabic head" direction="rtl" text-anchor="end">المشكلة</text>
    <text x="940" y="580" class="arabic body" direction="rtl" text-anchor="end">
      <tspan x="940">تُنتج النماذج النصية إجابات بلغة طبيعية،</tspan>
      <tspan x="940" dy="43">بينما تحتاج أدوات التطبيق والمحركات إلى</tspan>
      <tspan x="940" dy="43">بيانات وأوامر منظّمة وآمنة.</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="90" y="750" width="900" height="300" rx="25"/>
    <rect x="90" y="750" width="12" height="300" rx="6" fill="#56bd91"/>
    <text x="940" y="800" class="latin label" text-anchor="end">02 / PROJECT GOAL</text>
    <text x="940" y="855" class="arabic head" direction="rtl" text-anchor="end">الهدف</text>
    <text x="940" y="910" class="arabic body" direction="rtl" text-anchor="end">
      <tspan x="940">إنشاء مساحة عمل تجمع إدارة المهام</tspan>
      <tspan x="940" dy="43">والمشروعات مع مساعد AI وأدوات مرئية،</tspan>
      <tspan x="940" dy="43">وتحوّل الطلب إلى إجراء قابل للتحقق.</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="90" y="1075" width="900" height="340" rx="25"/>
    <rect x="90" y="1075" width="12" height="340" rx="6" fill="#56bd91"/>
    <text x="940" y="1125" class="latin label" text-anchor="end">03 / PLATFORM COMPONENTS</text>
    <text x="940" y="1180" class="arabic head" direction="rtl" text-anchor="end">مكوّنات النظام</text>
    <text x="940" y="1236" class="arabic bullet" direction="rtl" text-anchor="end">
      <tspan x="940">• واجهة ويب لإدارة مساحة العمل.</tspan>
      <tspan x="940" dy="43">• FastAPI وخيار قاعدة SQLite محلية.</tspan>
      <tspan x="940" dy="43">• تكامل مع مزوّدات AI متوافقة.</tspan>
      <tspan x="940" dy="43">• أدوات 2D و3D وموشن جرافيك.</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="90" y="1440" width="900" height="490" rx="25"/>
    <rect x="90" y="1440" width="12" height="490" rx="6" fill="#56bd91"/>
    <text x="940" y="1490" class="latin label" text-anchor="end">04 / PRIVACY &amp; ACCESS</text>
    <text x="940" y="1545" class="arabic head" direction="rtl" text-anchor="end">الخصوصية والتشغيل</text>
    <text x="940" y="1602" class="arabic body" direction="rtl" text-anchor="end">
      <tspan x="940">• يعمل محليًا افتراضيًا، مع خيار شبكة</tspan>
      <tspan x="940" dy="42">محلية موثوقة بإعداد المسؤول.</tspan>
      <tspan x="940" dy="48">• مفاتيح المزوّدات المحفوظة مشفّرة.</tspan>
      <tspan x="940" dy="48">• الطلبات المرسلة لمزوّد سحابي تخضع</tspan>
      <tspan x="940" dy="42">لسياسته؛ راجع الخصوصية قبل الاستخدام.</tspan>
      <tspan x="940" dy="48">• يمكن إيقاف المحركات غير المستخدمة</tspan>
      <tspan x="940" dy="42">لتقليل استهلاك موارد الجهاز.</tspan>
    </text>
  </g>

  <!-- Column 2 -->
  <g filter="url(#shadow)">
    <rect class="card" x="1030" y="420" width="940" height="1000" rx="25"/>
    <rect x="1030" y="420" width="12" height="1000" rx="6" fill="#348b69"/>
    <text x="1920" y="470" class="latin label" text-anchor="end">05 / CUSTOM AI INTEGRATION LAYER</text>
    <text x="1920" y="525" class="arabic head" direction="rtl" text-anchor="end">خوارزمية الترجمة والتكامل</text>
    <text x="1920" y="576" class="arabic small" direction="rtl" text-anchor="end">طبقة وسيطة بين المستخدم والنموذج وبين أدوات التطبيق والمحركات</text>

    <g>
      <rect x="1120" y="620" width="760" height="100" rx="18" fill="#eaf7ef" stroke="#c8e8d4" stroke-width="2"/>
      <circle cx="1176" cy="670" r="27" fill="#32845f"/>
      <text x="1176" y="680" class="latin" fill="#ffffff" font-size="26" text-anchor="middle" font-weight="700">1</text>
      <text x="1815" y="660" class="arabic" direction="rtl" text-anchor="end" fill="#234337" font-size="29" font-weight="700">طلب المستخدم + سياق مساحة العمل</text>
      <text x="1815" y="697" class="arabic small" direction="rtl" text-anchor="end">تحديد المقصود والبيانات ذات الصلة</text>

      <path d="M1500 722v32m-13-13 13 13 13-13" fill="none" stroke="#69ad83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1120" y="760" width="760" height="100" rx="18" fill="#f1f8f3" stroke="#d3e9d9" stroke-width="2"/>
      <circle cx="1176" cy="810" r="27" fill="#32845f"/>
      <text x="1176" y="820" class="latin" fill="#ffffff" font-size="26" text-anchor="middle" font-weight="700">2</text>
      <text x="1815" y="800" class="arabic" direction="rtl" text-anchor="end" fill="#234337" font-size="29" font-weight="700">تجهيز الطلب للنموذج النصي</text>
      <text x="1815" y="837" class="arabic small" direction="rtl" text-anchor="end">تعليمات وشكل استجابة متوقع</text>

      <path d="M1500 862v32m-13-13 13 13 13-13" fill="none" stroke="#69ad83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1120" y="900" width="760" height="100" rx="18" fill="#eaf7ef" stroke="#c8e8d4" stroke-width="2"/>
      <circle cx="1176" cy="950" r="27" fill="#32845f"/>
      <text x="1176" y="960" class="latin" fill="#ffffff" font-size="26" text-anchor="middle" font-weight="700">3</text>
      <text x="1815" y="940" class="arabic" direction="rtl" text-anchor="end" fill="#234337" font-size="29" font-weight="700">تحويل المخرجات إلى بنية محددة</text>
      <text x="1815" y="977" class="arabic small" direction="rtl" text-anchor="end">إجراء منظّم أو JSON أو رسالة للمحرّر</text>

      <path d="M1500 1002v32m-13-13 13 13 13-13" fill="none" stroke="#69ad83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1120" y="1040" width="760" height="100" rx="18" fill="#f1f8f3" stroke="#d3e9d9" stroke-width="2"/>
      <circle cx="1176" cy="1090" r="27" fill="#32845f"/>
      <text x="1176" y="1100" class="latin" fill="#ffffff" font-size="26" text-anchor="middle" font-weight="700">4</text>
      <text x="1815" y="1080" class="arabic" direction="rtl" text-anchor="end" fill="#234337" font-size="29" font-weight="700">التحقق من النوع والحقول والحدود</text>
      <text x="1815" y="1117" class="arabic small" direction="rtl" text-anchor="end">رفض المخرجات غير المطابقة قبل الإرسال</text>

      <path d="M1500 1142v32m-13-13 13 13 13-13" fill="none" stroke="#69ad83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1120" y="1180" width="760" height="100" rx="18" fill="#eaf7ef" stroke="#c8e8d4" stroke-width="2"/>
      <circle cx="1176" cy="1230" r="27" fill="#32845f"/>
      <text x="1176" y="1240" class="latin" fill="#ffffff" font-size="26" text-anchor="middle" font-weight="700">5</text>
      <text x="1815" y="1220" class="arabic" direction="rtl" text-anchor="end" fill="#234337" font-size="29" font-weight="700">تنفيذ الإجراء وحفظ التغييرات</text>
      <text x="1815" y="1257" class="arabic small" direction="rtl" text-anchor="end">عبر واجهات التطبيق المحددة</text>
    </g>

    <rect x="1120" y="1305" width="760" height="76" rx="16" fill="#173c31"/>
    <text x="1500" y="1353" class="arabic" direction="rtl" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">النموذج لا يتحكم مباشرة بالمحرك</text>
    <text x="1500" y="1398" class="arabic small" direction="rtl" text-anchor="middle">هذه طبقة ربط خاصة بالمشروع، وليست نموذجًا جديدًا مدرّبًا من الصفر.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1030" y="1440" width="940" height="490" rx="25"/>
    <rect x="1030" y="1440" width="12" height="490" rx="6" fill="#348b69"/>
    <text x="1920" y="1490" class="latin label" text-anchor="end">06 / DESIGN &amp; TESTING</text>
    <text x="1920" y="1545" class="arabic head" direction="rtl" text-anchor="end">المنهجية والتحقق</text>
    <text x="1920" y="1602" class="arabic body" direction="rtl" text-anchor="end">
      <tspan x="1920">1. تحديد احتياجات مساحة العمل.</tspan>
      <tspan x="1920" dy="43">2. بناء الواجهة والخدمات الخلفية.</tspan>
      <tspan x="1920" dy="43">3. ربط النموذج بالأدوات عبر الطبقة.</tspan>
      <tspan x="1920" dy="43">4. اختبار الحسابات والعزل والوضع المحلي.</tspan>
    </text>
    <rect x="1100" y="1792" width="800" height="103" rx="16" fill="#fff7e6" stroke="#eed9a3" stroke-width="2"/>
    <text x="1860" y="1834" class="arabic" direction="rtl" text-anchor="end" fill="#72551c" font-size="27" font-weight="700">دليل التحقق</text>
    <text x="1860" y="1873" class="arabic" direction="rtl" text-anchor="end" fill="#72551c" font-size="24">اختبارات وظيفية لمسارات الحسابات والصلاحيات والوصول المحلي.</text>
  </g>

  <!-- Column 3 -->
  <g filter="url(#shadow)">
    <rect class="card" x="2010" y="420" width="900" height="405" rx="25"/>
    <rect x="2010" y="420" width="12" height="405" rx="6" fill="#56bd91"/>
    <text x="2860" y="470" class="latin label" text-anchor="end">07 / KEY CAPABILITIES</text>
    <text x="2860" y="525" class="arabic head" direction="rtl" text-anchor="end">الوظائف الرئيسية</text>
    <text x="2860" y="582" class="arabic bullet" direction="rtl" text-anchor="end">
      <tspan x="2860">• إدارة المهام والمشروعات.</tspan>
      <tspan x="2860" dy="44">• محادثة ومساعد AI للمحتوى والخطط.</tspan>
      <tspan x="2860" dy="44">• مخططات عمل وتعليمات قابلة لإعادة الاستخدام.</tspan>
      <tspan x="2860" dy="44">• تحرير 2D و3D والموشن جرافيك.</tspan>
      <tspan x="2860" dy="44">• واجهة عربية وإنجليزية وإدارة حسابات.</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="2010" y="850" width="900" height="350" rx="25"/>
    <rect x="2010" y="850" width="12" height="350" rx="6" fill="#56bd91"/>
    <text x="2860" y="900" class="latin label" text-anchor="end">08 / OBSERVED OUTCOME</text>
    <text x="2860" y="955" class="arabic head" direction="rtl" text-anchor="end">المخرجات الحالية</text>
    <text x="2860" y="1012" class="arabic body" direction="rtl" text-anchor="end">
      <tspan x="2860">تطبيق متكامل قابل للتشغيل محليًا، مع</tspan>
      <tspan x="2860" dy="43">إعداد اختياري للشبكة المحلية، وإمكانية</tspan>
      <tspan x="2860" dy="43">تفعيل المحركات المستخدمة فقط.</tspan>
    </text>
    <text x="2860" y="1155" class="arabic small" direction="rtl" text-anchor="end">لم تُنشر نسب تحسّن؛ يلزم قياسها بتجربة مستخدم.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="2010" y="1225" width="900" height="335" rx="25"/>
    <rect x="2010" y="1225" width="12" height="335" rx="6" fill="#56bd91"/>
    <text x="2860" y="1275" class="latin label" text-anchor="end">09 / LIMITATIONS</text>
    <text x="2860" y="1330" class="arabic head" direction="rtl" text-anchor="end">الحدود</text>
    <text x="2860" y="1385" class="arabic body" direction="rtl" text-anchor="end">
      <tspan x="2860">• المزوّد السحابي يحتاج اتصالًا بالإنترنت.</tspan>
      <tspan x="2860" dy="43">• الشبكة مخصصة لبيئة محلية موثوقة.</tspan>
      <tspan x="2860" dy="43">• بعض المحررات المدمجة لا تدعم عزلًا</tspan>
      <tspan x="2860" dy="43">كاملًا بين المستخدمين.</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="2010" y="1585" width="900" height="345" rx="25"/>
    <rect x="2010" y="1585" width="12" height="345" rx="6" fill="#56bd91"/>
    <text x="2860" y="1635" class="latin label" text-anchor="end">10 / CONCLUSION &amp; NEXT STEPS</text>
    <text x="2860" y="1690" class="arabic head" direction="rtl" text-anchor="end">الخلاصة والتطوير</text>
    <text x="2860" y="1745" class="arabic body" direction="rtl" text-anchor="end">
      <tspan x="2860">تربط طبقة التكامل بين اللغة الطبيعية</tspan>
      <tspan x="2860" dy="42">وأدوات الإنتاج من خلال بيانات محددة</tspan>
      <tspan x="2860" dy="42">ومتحقق منها.</tspan>
      <tspan x="2860" dy="48">مستقبلًا: اختبار مستخدمين وقياس زمن</tspan>
      <tspan x="2860" dy="42">إنجاز المهام ومعدل الأخطاء.</tspan>
    </text>
  </g>

  <rect x="90" y="1970" width="2820" height="2" fill="#d7e5dc"/>
  <text x="1500" y="2025" class="arabic" direction="rtl" text-anchor="middle" fill="#294a3b" font-size="24" font-weight="700">المراجع التقنية</text>
  <text x="1500" y="2065" class="latin" text-anchor="middle" fill="#60756a" font-size="21">Project documentation: README.md • FastAPI: fastapi.tiangolo.com • SQLite: sqlite.org/docs.html</text>
  <text x="1500" y="2130" class="latin" text-anchor="middle" fill="#173c31" font-size="27" font-weight="700">AI TASKFLOW  •  CREATED BY ADAM MAHMOUD ABDELALIM</text>
  <text x="1500" y="2170" class="arabic" direction="rtl" text-anchor="middle" fill="#70857b" font-size="20">ملف متجهي للطباعة والاستيراد إلى Canva — نسبة أبعاد 4:3</text>
</svg>
